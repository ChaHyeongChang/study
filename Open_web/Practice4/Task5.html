<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="mystyle.css">
    <title>My Personal Webpage</title>
    <style>
        li{
            background-color: lightblue;
            display: inline-block;
            padding: 10px 20px;
        }
        .avatar{
            position: relative;
            float: left;
        }
        .caption{
            position: absolute;
            background-color: lightblue;
            padding: 10px 30px;
            bottom: 0;
        }
        .section{
            clear: left;
        }

    </style>
</head>
<body>

    <div id="header">
        <h1>Welcome to My Personal Webpage</h1>
    </div>

    <div id="navigation">
       <p>
            <li href="index.html">Home</li>

        </p>
    </div>

    <div id="content">

        <div class="section">

            <div class="avatar">
                <img src="profile.png" alt="My Profile Picture" width="200">

            </div>
            
            <p>Hi! My name is Aziz Nasridinov. I am passionate about web development and learning HTML.</p> 
            <p>My website: <a href="http://dalab.cbnu.ac.kr" class = "clickhere">Click Here</a></p>       
        </div>

        <div class="section">
            <fieldset>
                <legend>Contact Me</legend>

                <form>
                    <label for="name">Name:</label><br>

                    <label for="email">Email:</label><br>

            </fieldset>
        </div>
    </div>

    <div id = "footer">

</html>
