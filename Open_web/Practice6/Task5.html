<!DOCTYPE html>
<html>
<body>
    <h2>JavaScript Function</h2>
    <p>Convert from Fahrenheit to Celsius</p>
    <p id="demo"></p>

    <script>
        function applyDiscount(f){
            if(f>100){
                return f - (f*0.15);
            }
            else if(f >= 50 && f <= 100){
                return f - (f*0.1);
            }
            else{
                return f;
            }
        }


        alert("Fina: price: $" + applyDiscount(100));
        //document.getElementById("demo").innerHTML = applyDiscount(100);
    </script>
</body>
</html>
