<!DOCTYPE html>
<html>
<body>
    <h2>Bank Balance</h2>
    <p id="output"></p>

    <script>
        const balance = 1000;
        const interestRate = 0.05;
        const newBalance = balance + balance* interestRate;

        document.getElementById("output").innerHTML = "New balance: $" + newBalance;
    </script>
</body>
</html>
